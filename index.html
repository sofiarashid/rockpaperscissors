<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- POPUP -->
    <div id="popup-overlay">
        <div class="popup">
            <h2>Enter Your Name</h2>
            <input type="text" id="nameInput" placeholder="Your Name">
            <br><br>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="game">
        <div class="title">
            <h1>Rock Paper Scissors Game</h1>
        </div>

        <div class="players">

            <!-- PLAYER -->
            <div class="player-box">
                <div class="player-name" id="player1-name">Player 1</div>

                <div class="progress-bar">
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                </div>

                <div class="player-image">
                    <button onclick="playerMove('rock')">ROCK</button>
                    <button onclick="playerMove('paper')">PAPER</button>
                    <button onclick="playerMove('scissors')">SCISSORS</button>
                </div>

                <!-- Player move image -->
                <img src="rock1.png" class="player-move" id="player1-move">
            </div>

            <!-- COMPUTER -->
            <div class="player-box">
                Computer

                <div class="progress-bar">
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                </div>

                <!-- Computer move image -->
                <img src="rock2.png" class="player-move" id="computer-move">
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
