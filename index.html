<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-dark text-light">

    <!-- POPUP -->
    <div id="popup-overlay">
        <div class="popup text-center">
            <h2>Enter Your Name</h2>
            <input type="text" id="nameInput" placeholder="Your Name">
            <br><br>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="container my-4 game">

        <!-- TITLE -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="title p-3 text-center">
                    <h1>Rock Paper Scissors Game</h1>
                </div>
            </div>
        </div>

        <!-- PLAYERS -->
        <div class="row players">

            <!-- PLAYER -->
            <div class="col-12 col-md-6 mb-4 mb-md-0">
                <div class="player-box p-3 text-center">
                    <div class="player-name" id="player1-name">Player 1</div>

                    <div class="progress-bar d-flex justify-content-between my-2 px-1">
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                    </div>

                    <div class="player-image d-flex justify-content-center gap-2 flex-wrap my-2">
                        <button id="rockBtn" onclick="playRound('rock')">ROCK</button>
                        <button id="paperBtn" onclick="playRound('paper')">PAPER</button>
                        <button id="scissorsBtn" onclick="playRound('scissors')">SCISSORS</button>
                    </div>

                    <img src="rock1.png" class="player-move mt-2" id="player1-move">
                </div>
            </div>

            <!-- COMPUTER -->
            <div class="col-12 col-md-6">
                <div class="player-box p-3 text-center">
                    <div class="player-name">Computer</div>

                    <div class="progress-bar d-flex justify-content-between my-2 px-1">
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                        <div class="checkpoint"></div>
                    </div>

                    <img src="rock2.png" class="player-move mt-2" id="computer-move">
                </div>
            </div>

        </div>

        <!-- RESULT -->
        <div class="row mt-3">
            <div class="col-12">
                <div id="resultBox"></div>
                <button id="resetBtn" class="w-100 mt-2">Reset Game</button>
            </div>
        </div>

    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
