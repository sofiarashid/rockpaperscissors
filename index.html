<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body> <!-- POPUP -->
    <div id="popup-overlay">
        <div class="popup">
            <h2>Enter Your Name</h2> <input type="text" id="nameInput" placeholder="Your Name"> <br><br> <button
                id="startBtn">Start Game</button>
        </div>
    </div>
    <div class="game container">
        <div class="title col-12">
            <h1>Rock Paper Scissors Game</h1>
        </div>
        <div class="players col-12"> <!-- PLAYER -->
            <div class="player-box col-6">
                <div class="player-name" id="player1-name">Player 1</div>
                <div class="progress-bar">
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                </div>
                <div class="player-image">
                    <button id="rockBtn" onclick="playRound('rock')">ROCK</button>
                    <button id="paperBtn" onclick="playRound('paper')">PAPER</button>
                    <button id="scissorsBtn" onclick="playRound('scissors')">SCISSORS</button>
                </div>
                <img src="rock1.png" class="player-move img-fluid" id="player1-move">
            </div> <!-- COMPUTER -->
            <div class="player-box col-6">
                <div class="player-name">Computer</div>
                <div class="progress-bar">
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                    <div class="checkpoint"></div>
                </div> <img src="rock2.png" class="player-move img=fluid" id="computer-move">
            </div>
        </div>
        <div class="col-12">
            <div id="resultBox">Make your choice!</div>
            <button id="resetBtn" style="display:none;">Reset Game</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
