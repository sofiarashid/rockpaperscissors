<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exported from Figma">
    <title>RPS Game</title>
    <link rel="stylesheet" href="https://use.typekit.net/abcd123.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="popup-overlay">
        <div class="popup">
            <h2>Enter Your Name</h2>
            <input type="text" id="nameInput" placeholder="Your Name">
            <br><br>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="game m-5">
        <div class="title">
            <h1 class="titlefont">Rock Paper Scissors</h1>
        </div>

        <div class="players">
            <div class="player-box" id="player1">Player 1</div>
            <div class="player-box">Computer</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
